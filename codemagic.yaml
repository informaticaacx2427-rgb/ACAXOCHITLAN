workflows:
  ios-release:
    name: iOS IPA Release

    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install
          cd ..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      # 🔥 FIX CRÍTICO: FORZAR TEAM + SIGNING
      - name: Build iOS Archive
        script: |
          set -ex

          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=$CM_TEAM_ID \
            -allowProvisioningUpdates \
            archive

      # 🔥 EXPORT IPA REAL
      - name: Export IPA
        script: |
          set -ex

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates

      # 🔍 DEBUG (opcional)
      - name: Find IPA (DEBUG)
        script: |
          echo "Searching for IPA..."
          find . -name "*.ipa"

      - name: Check build output (DEBUG)
        script: |
          echo "Checking iOS build folder..."
          ls -R build/ios || true

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/**/*.ipa
