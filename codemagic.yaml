workflows:
  ios-release:
    name: iOS Release

    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

      groups:
        - ACAXOCHITLAN

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo
        use_automatic_signing: true

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
