workflows:
  ios-release:
    name: iOS IPA Release

    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA (verbose)
        script: |
          flutter build ipa --release --verbose

      - name: Find IPA (DEBUG)
        script: |
          echo "Searching for IPA files..."
          find . -name "*.ipa"

      - name: Check iOS build output (DEBUG)
        script: |
          echo "Checking build/ios folder..."
          ls -R build/ios || true

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/**/*.ipa
