workflows:
  ios-release:
    name: iOS IPA Release

    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      # 🔥 BUILD CORRECTO PARA CODEMAGIC
      - name: Build IPA
        script: |
          flutter build ipa --release --export-method app-store --verbose

      # 🔍 DEBUG (opcional pero útil)
      - name: Check IPA output
        script: |
          echo "Searching IPA..."
          find build -name "*.ipa" || true

    artifacts:
      - build/ios/ipa/*.ipa
