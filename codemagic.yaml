workflows:
  ios-release:
    name: iOS IPA Release

    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic App

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo

    scripts:
      # LIMPIAR PROYECTO
      - name: Clean project
        script: |
          flutter clean
          flutter pub get

      # COCOAPODS
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      # INCREMENTO AUTOMÁTICO DE BUILD NUMBER (SOLUCIÓN A TU ERROR)
      - name: Increment build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number com.acaxochi.turismo) + 1))
          echo "Nuevo build number: $BUILD_NUMBER"
          agvtool new-version -all $BUILD_NUMBER

      # FIRMA Y PROFILES
      - name: Set up code signing
        script: |
          keychain initialize

          app-store-connect fetch-signing-files com.acaxochi.turismo \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          xcode-project use-profiles

      # BUILD IPA
      - name: Build IPA
        script: |
          flutter build ipa --release

      # VERIFICAR IPA
      - name: Verify IPA
        script: |
          find build -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
