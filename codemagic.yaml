workflows:
  ios-release:
    name: iOS IPA Release

    max_build_duration: 60

    integrations:
      app_store_connect: codemagic

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo

    scripts:
      - name: Flutter packages
        script: |
          flutter clean
          flutter pub get

      - name: CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      # INSTALAR CERTIFICADOS Y PROFILES
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.acaxochi.turismo --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      # BUILD IOS
      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --export-method app-store \
            --export-options-plist=ios/ExportOptions.plist

      # DEBUG
      - name: Find IPA
        script: |
          find build -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
