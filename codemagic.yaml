workflows:
  ios-release:
    name: iOS IPA Release

    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic App

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Fetch signing files
        script: |
          keychain initialize

          app-store-connect fetch-signing-files com.acaxochi.turismo \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

      - name: Verify IPA
        script: |
          find build -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
