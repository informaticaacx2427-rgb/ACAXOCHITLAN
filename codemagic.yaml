workflows:
  ios-release:
    name: iOS IPA Release

    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic App

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo

    scripts:
      # LIMPIAR PROYECTO
      - name: Clean project
        script: |
          flutter clean
          flutter pub get

      # INSTALAR COCOAPODS
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      # CONFIGURAR FIRMAS Y PROFILES
      - name: Set up code signing
        script: |
          keychain initialize

          app-store-connect fetch-signing-files com.acaxochi.turismo \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          xcode-project use-profiles

      # BUILD IPA APP STORE
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-method app-store

      # VERIFICAR IPA
      - name: Verify IPA
        script: |
          echo "BUSCANDO IPA..."
          find build -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
