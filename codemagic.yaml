workflows:
  ios-release:
    name: iOS IPA Release

    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install
          cd ..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      # ✅ ARCHIVE REAL CON XCODE
      - name: Build iOS Archive
        script: |
          set -ex

          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive

      # ✅ EXPORT REAL IPA
      - name: Export IPA
        script: |
          set -ex

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      # 🔍 DEBUG (opcional pero útil)
      - name: Find IPA (DEBUG)
        script: |
          echo "Searching for IPA files..."
          find . -name "*.ipa"

      - name: Check iOS build output (DEBUG)
        script: |
          echo "Checking build/ios folder..."
          ls -R build/ios || true

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/**/*.ipa
