workflows:
  ios-release:
    name: iOS IPA Release

    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install
          cd ..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      # ✅ BUILD LIMPIO (SIN HACKS)
      - name: Build iOS Archive
        script: |
          set -ex

          flutter build ipa --release

      # 🔍 DEBUG OPCIONAL
      - name: Find IPA
        script: |
          echo "Searching IPA..."
          find . -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
