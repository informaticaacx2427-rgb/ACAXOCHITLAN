workflows:
  ios-release:
    name: iOS IPA Release

    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo

    scripts:
      # LIMPIAR PROYECTO
      - name: Clean project
        script: |
          flutter clean
          flutter pub get

      # COCOAPODS
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      # CONFIGURAR CERTIFICADOS Y PROFILES APP STORE
      - name: Set up code signing
        script: |
          keychain initialize

          app-store-connect fetch-signing-files com.acaxochi.turismo \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          xcode-project use-profiles

      # BUILD IOS
      - name: Build iOS
        script: |
          flutter build ipa --release

      # VERIFICAR IPA
      - name: Debug IPA
        script: |
          find build -name "*.ipa" || true

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration

        submit_to_testflight: true

        beta_groups:
          - Internal Testers
