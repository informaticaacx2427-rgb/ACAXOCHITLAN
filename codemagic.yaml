workflows:
  ios-release:
    name: iOS IPA Release

    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install
          cd ..

      # 🔥 CRÍTICO: aplicar perfiles correctamente
      - name: Set up code signing
        script: |
          xcode-project use-profiles

      # 🔥 FIX REAL: forzar signing dentro de Xcode build settings
      - name: Fix Xcode signing
        script: |
          set -ex

          cd ios

          # asegurar team en proyecto
          sed -i '' "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = $CM_TEAM_ID;/g" Runner.xcodeproj/project.pbxproj || true

      # 🔥 BUILD CORRECTO
      - name: Build iOS Archive
        script: |
          set -ex

          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            archive

      # 🔥 EXPORT CORRECTO
      - name: Export IPA
        script: |
          set -ex

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates

    artifacts:
      - build/ios/ipa/*.ipa
