workflows:
  ios-release:
    name: iOS IPA Release

    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic iOS

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Fetch signing files
        script: |
          keychain initialize

          app-store-connect fetch-signing-files com.acaxochi.turismo \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          xcode-project use-profiles

      # 🔥 BUILD ARCHIVE MANUAL (EVITA BUG FLUTTER IPA)
      - name: Build Archive
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive

      # 🔥 EXPORT CORRECTO (FIX PROVISIONING PROFILE)
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa

      - name: Verify IPA
        script: |
          find build -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
